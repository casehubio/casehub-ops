<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="gApp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d2e3fc"/>
    </linearGradient>
    <linearGradient id="gOps" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fce8e6"/>
      <stop offset="100%" stop-color="#f8d2cf"/>
    </linearGradient>
    <linearGradient id="gFleet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6f4ea"/>
      <stop offset="100%" stop-color="#ceead6"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" font-size="16" font-weight="600" fill="#333">Three layers, one word: "pool"</text>

  <!-- App layer -->
  <rect x="40" y="55" width="640" height="90" rx="8" fill="url(#gApp)" stroke="#4285f4" stroke-width="1.5"/>
  <text x="60" y="80" font-size="13" font-weight="600" fill="#1a56db">Application Config Layer</text>
  <text x="60" y="100" font-size="12" fill="#444">platform / agent-config-core</text>
  <rect x="60" y="110" width="200" height="26" rx="4" fill="#fff" stroke="#4285f4" stroke-width="1"/>
  <text x="160" y="128" text-anchor="middle" font-size="11" font-weight="500" fill="#1a56db">PoolDeclaration</text>
  <text x="280" y="128" font-size="11" fill="#666">name, agentId, backend, minActive, maxActive,</text>
  <text x="280" y="140" font-size="11" fill="#666">salience, clearing, maxPromptTokens …</text>

  <!-- Arrow down -->
  <line x1="160" y1="145" x2="160" y2="170" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="155,168 160,178 165,168" fill="#888"/>
  <text x="175" y="168" font-size="10" fill="#888">manifest adapter (future)</text>

  <!-- Ops layer -->
  <rect x="40" y="180" width="640" height="90" rx="8" fill="url(#gOps)" stroke="#ea4335" stroke-width="1.5"/>
  <text x="60" y="205" font-size="13" font-weight="600" fill="#c5221f">Infrastructure Provisioning Layer</text>
  <text x="60" y="225" font-size="12" fill="#444">ops / deployment module</text>
  <rect x="60" y="235" width="200" height="26" rx="4" fill="#fff" stroke="#ea4335" stroke-width="1"/>
  <text x="160" y="253" text-anchor="middle" font-size="11" font-weight="500" fill="#c5221f">PoolNodeSpec</text>
  <text x="280" y="248" font-size="11" fill="#666">applicationId, agentId, backend, minActive,</text>
  <text x="280" y="260" font-size="11" fill="#666">maxActive, scaling, eviction …</text>

  <!-- Arrow down -->
  <line x1="160" y1="270" x2="160" y2="295" stroke="#888" stroke-width="1.5"/>
  <polygon points="155,293 160,303 165,293" fill="#888"/>
  <text x="175" y="293" font-size="10" fill="#888">PoolOperations SPI</text>

  <!-- Fleet layer -->
  <rect x="40" y="305" width="640" height="80" rx="8" fill="url(#gFleet)" stroke="#34a853" stroke-width="1.5"/>
  <text x="60" y="330" font-size="13" font-weight="600" fill="#1e8e3e">Fleet Implementation Layer</text>
  <text x="60" y="350" font-size="12" fill="#444">ops / claudony module → ClaudonyPoolOperations</text>
  <rect x="60" y="357" width="200" height="22" rx="4" fill="#fff" stroke="#34a853" stroke-width="1"/>
  <text x="160" y="373" text-anchor="middle" font-size="11" font-weight="500" fill="#1e8e3e">ClaudonyFleetClient</text>
  <text x="280" y="370" font-size="11" fill="#666">registerApp, updateApp (pools are sub-resources)</text>

  <!-- Shared fields callout -->
  <rect x="470" y="160" width="195" height="60" rx="6" fill="#fff3e0" stroke="#f9a825" stroke-width="1"/>
  <text x="480" y="178" font-size="11" font-weight="600" fill="#e65100">Shared vocabulary</text>
  <text x="480" y="195" font-size="11" fill="#666">agentId, backend,</text>
  <text x="480" y="210" font-size="11" fill="#666">minActive, maxActive</text>
</svg>
