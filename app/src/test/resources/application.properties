# Default datasource — app domain + casehub-work tables
# drop-and-create: Hibernate creates tables from entity definitions.
# Flyway disabled: avoids migration ordering conflicts across modules.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:ops-app-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.reactive=false
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.flyway.migrate-at-start=false
quarkus.http.test-port=0
quarkus.devservices.enabled=false

# Quartz RAM store — no JDBC scheduler tables in tests
quarkus.quartz.store-type=ram
quarkus.scheduler.start-mode=forced

# Engine jar indexing — casehub-engine modules lack embedded Jandex indices
quarkus.index-dependency.engine-common.group-id=io.casehub
quarkus.index-dependency.engine-common.artifact-id=casehub-engine-common
quarkus.index-dependency.engine-planning.group-id=io.casehub
quarkus.index-dependency.engine-planning.artifact-id=casehub-engine-planning
quarkus.index-dependency.engine-work-adapter.group-id=io.casehub
quarkus.index-dependency.engine-work-adapter.artifact-id=casehub-engine-work-adapter
quarkus.index-dependency.engine-scheduler-quartz.group-id=io.casehub
quarkus.index-dependency.engine-scheduler-quartz.artifact-id=casehub-engine-scheduler-quartz
quarkus.index-dependency.engine-persistence-memory.group-id=io.casehub
quarkus.index-dependency.engine-persistence-memory.artifact-id=casehub-engine-persistence-memory
quarkus.index-dependency.engine-testing.group-id=io.casehub
quarkus.index-dependency.engine-testing.artifact-id=casehub-engine-testing

# CDI exclusions — stale transitive beans from snapshot deps
quarkus.arc.exclude-types=\
  io.casehub.platform.mock.MockCurrentPrincipal,\
  io.casehub.work.runtime.service.NoOpGroupMembershipProvider,\
  io.casehub.work.engine.WorkStrategyContributor,\
  io.casehub.neocortex.mindmap.intelligence.consolidation.BehavioralSynthesisPhase,\
  io.casehub.work.runtime.service.ExpiryCleanupJob,\
  io.casehub.work.runtime.service.ClaimDeadlineJob,\
  io.casehub.work.runtime.strategy.RoutingCursorCleanupJob,\
  io.casehub.connectors.**,\
  io.casehub.work.engine.recovery.HumanTaskRecoveryService

# Ops config — test defaults for beans with List<String> @ConfigProperty
casehub.ops.approval.roles.critical=ops-admin
casehub.ops.approval.roles.high=ops-approver
casehub.ops.k8s.approval.critical-namespaces=kube-system
casehub.ops.k8s.approval.production-namespaces=production
