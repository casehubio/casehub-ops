# Level 14: Fault Recovery
# Methodology step: OPERATE — Fault Detection and Replacement
# Prerequisites: Level 10
# See README.md for walkthrough

desiredState:
  namespace: casehub
  name: fault-recovery

nodes:
  platform:
    type: casehub_application
    spec:
      applicationId: platform
      image: casehubio/casehub-runtime:latest
      deploymentTarget: claudony
      replicas: 1
      config:
        role: platform

  support-app:
    type: casehub_application
    dependsOn: [platform]
    spec:
      applicationId: support-app
      image: casehubio/casehub-runtime:latest
      deploymentTarget: claudony
      replicas: 1
      config:
        role: support
        support.mode: pool-managed
        support.channel: direct

  support-pool:
    type: pool
    dependsOn: [support-app]
    spec:
      applicationId: support-app
      agentId: support-agent
      backend: claudony
      minActive: 3
      maxActive: 8
