# Level 01: Hello LLM
# Methodology step: DEPLOY — First App
# Prerequisites: None

desiredState:
  namespace: casehub
  name: hello-llm

nodes:
  my-llm:
    type: casehub_application
    spec:
      applicationId: my-llm
      image: casehubio/casehub-runtime:latest
      deploymentTarget: claudony
      replicas: 1
      config:
        llm.capability: fast
