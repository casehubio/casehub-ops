# Level 03: Case Management
# Methodology step: DEPLOY — Case Operations
# Prerequisites: Level 02

desiredState:
  namespace: casehub
  name: case-management

nodes:
  platform:
    type: casehub_application
    spec:
      applicationId: platform
      image: casehubio/casehub-runtime:latest
      deploymentTarget: claudony
      replicas: 1
      config:
        role: platform
        llm.capability: fast
        llm.identity-source: eidos

  ledger:
    type: casehub_application
    dependsOn: [platform]
    spec:
      applicationId: ledger
      image: casehubio/casehub-runtime:latest
      deploymentTarget: claudony
      replicas: 1
      config:
        role: ledger

  qhorus:
    type: casehub_application
    dependsOn: [platform, ledger]
    spec:
      applicationId: qhorus
      image: casehubio/casehub-runtime:latest
      deploymentTarget: claudony
      replicas: 1
      config:
        role: qhorus
