# ============================================================
# Level 01: Hello LLM
# ============================================================
# The minimum viable CaseHub app. Deploys four services via
# claudony: manifest (app descriptors), eidos (knowledge),
# engine (execution runtime), and an LLM app that uses them.
#
# Prerequisites: None — this is where you start.
#
# What you'll learn:
#   - How to declare CaseHub apps in YAML
#   - How dependency edges control deployment order
#   - How eidos generates the LLM's brief from application metadata
#   - How claudony registers and manages your apps
#
# After deployment, the reconciliation loop ensures:
#   1. manifest starts first (no dependencies)
#   2. eidos starts after manifest
#   3. engine starts after eidos
#   4. my-llm starts after engine
#
# Try it: change replicas or config values and re-reconcile.
# Only the changed nodes will be updated.
# ============================================================

desiredState:
  namespace: casehub
  name: hello-llm

nodes:
  manifest:
    type: casehub_application
    spec:
      applicationId: manifest
      image: casehubio/manifest:latest
      deploymentTarget: claudony
      replicas: 1

  eidos:
    type: casehub_application
    dependsOn: [manifest]
    spec:
      applicationId: eidos
      image: casehubio/eidos:latest
      deploymentTarget: claudony
      replicas: 1

  engine:
    type: casehub_application
    dependsOn: [eidos]
    spec:
      applicationId: engine
      image: casehubio/engine:latest
      deploymentTarget: claudony
      replicas: 1

  my-llm:
    type: casehub_application
    dependsOn: [engine]
    spec:
      applicationId: my-llm
      image: casehubio/my-llm-app:latest
      deploymentTarget: claudony
      replicas: 1
      config:
        llm.capability: fast
        llm.identity-source: eidos
