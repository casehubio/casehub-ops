# ============================================================
# Level 03: Case Management
# ============================================================
# Builds on Level 02 by adding qhorus (case management).
# Cases are the fundamental unit of work in CaseHub — they
# group tasks, track lifecycle, and provide conversation context.
#
# Prerequisites: Level 02 (02-accountability.yaml)
#
# What you'll learn:
#   - How case management composes on top of work + ledger
#   - How qhorus bridges task execution and user interaction
#   - How the dependency graph grows with cross-cutting services
#
# Dependency graph:
#   manifest ──> eidos ──┬──> engine ──┬──> work ──┬──> qhorus ──> my-llm
#                        │             │      ↑     │      ↑
#                        └──> ledger ──┘──────┘─────┘──────┘
#
# The reconciliation loop ensures:
#   1. manifest starts first (no dependencies)
#   2. eidos starts after manifest
#   3. ledger and engine can start in parallel (both depend only on eidos)
#   4. work starts after both engine and ledger
#   5. qhorus starts after both work and ledger
#   6. my-llm starts after qhorus
# ============================================================

desiredState:
  namespace: casehub
  name: case-management

nodes:
  manifest:
    type: casehub_application
    spec:
      applicationId: manifest
      image: casehubio/manifest:latest
      deploymentTarget: claudony
      replicas: 1

  eidos:
    type: casehub_application
    dependsOn: [manifest]
    spec:
      applicationId: eidos
      image: casehubio/eidos:latest
      deploymentTarget: claudony
      replicas: 1

  engine:
    type: casehub_application
    dependsOn: [eidos]
    spec:
      applicationId: engine
      image: casehubio/engine:latest
      deploymentTarget: claudony
      replicas: 1

  ledger:
    type: casehub_application
    dependsOn: [eidos]
    spec:
      applicationId: ledger
      image: casehubio/ledger:latest
      deploymentTarget: claudony
      replicas: 1

  work:
    type: casehub_application
    dependsOn: [engine, ledger]
    spec:
      applicationId: work
      image: casehubio/work:latest
      deploymentTarget: claudony
      replicas: 1

  qhorus:
    type: casehub_application
    dependsOn: [work, ledger]
    spec:
      applicationId: qhorus
      image: casehubio/qhorus:latest
      deploymentTarget: claudony
      replicas: 1

  my-llm:
    type: casehub_application
    dependsOn: [qhorus]
    spec:
      applicationId: my-llm
      image: casehubio/my-llm-app:latest
      deploymentTarget: claudony
      replicas: 1
      config:
        llm.capability: fast
        llm.identity-source: eidos
