# Level 15: Governed Interaction
# Methodology step: GOVERN — Negotiation Patterns
# Prerequisites: Level 01
# See README.md for walkthrough

desiredState:
  namespace: casehub
  name: governed-interaction

nodes:
  platform:
    type: casehub_application
    spec:
      applicationId: platform
      image: casehubio/casehub-runtime:latest
      deploymentTarget: claudony
      replicas: 1
      config:
        role: platform

  coordinator:
    type: casehub_application
    dependsOn: [platform]
    spec:
      applicationId: coordinator
      image: casehubio/casehub-runtime:latest
      deploymentTarget: claudony
      replicas: 1
      config:
        role: coordinator
        llm.capability: deep
        llm.role: coordinator

  reviewer-1:
    type: casehub_application
    dependsOn: [coordinator]
    spec:
      applicationId: reviewer-1
      image: casehubio/casehub-runtime:latest
      deploymentTarget: claudony
      replicas: 1
      config:
        role: reviewer
        llm.capability: deep
        llm.role: reviewer

  reviewer-2:
    type: casehub_application
    dependsOn: [coordinator]
    spec:
      applicationId: reviewer-2
      image: casehubio/casehub-runtime:latest
      deploymentTarget: claudony
      replicas: 1
      config:
        role: reviewer
        llm.capability: deep
        llm.role: reviewer

  design-review:
    type: channel
    dependsOn: [coordinator, reviewer-1, reviewer-2]
    spec:
      name: design-review
      semantic: APPEND
      protocols: [NEGOTIATION]
      protocolParticipants: [coordinator, reviewer-1, reviewer-2]
      policyOverrides:
        negotiation.acceptance: majority
        negotiation.max-rounds: "3"
