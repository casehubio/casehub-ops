# Level 09: Chat UI
# Methodology step: DEPLOY — Conversation Viewer
# Prerequisites: Level 03
# See README.md for walkthrough

desiredState:
  namespace: casehub
  name: chat-ui

nodes:
  platform:
    type: casehub_application
    spec:
      applicationId: platform
      image: casehubio/casehub-runtime:latest
      deploymentTarget: claudony
      replicas: 1
      config:
        role: platform
        llm.capability: fast

  ledger:
    type: casehub_application
    dependsOn: [platform]
    spec:
      applicationId: ledger
      image: casehubio/casehub-runtime:latest
      deploymentTarget: claudony
      replicas: 1
      config:
        role: ledger

  qhorus:
    type: casehub_application
    dependsOn: [platform, ledger]
    spec:
      applicationId: qhorus
      image: casehubio/casehub-runtime:latest
      deploymentTarget: claudony
      replicas: 1
      config:
        role: qhorus

  chat-viewer:
    type: casehub_application
    dependsOn: [qhorus]
    spec:
      applicationId: chat-viewer
      image: casehubio/casehub-runtime:latest
      deploymentTarget: claudony
      replicas: 1
      config:
        role: chat-viewer
        chat.mode: conversation-viewer
        chat.session-source: qhorus
        chat.channel-type: direct
