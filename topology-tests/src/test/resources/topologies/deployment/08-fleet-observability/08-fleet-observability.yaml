# Level 08: Fleet Observability
# Methodology step: OPERATE — Health and Recovery
# Prerequisites: Level 04, Level 07
# See README.md for walkthrough

desiredState:
  namespace: casehub
  name: llm-fleet

data:
  llm-fleet:
    inline: |
      name:STRING,role:STRING,capability:STRING,archetype:STRING,adjective:STRING,domain:STRING
      analyst,analyst,deep,investigator,methodical,analysis
      coder,developer,fast,engineer,pragmatic,software-engineering
      assistant,assistant,balanced,coordinator,versatile,general

nodes:
  manifest:
    type: claudony_app
    spec:
      name: manifest
      displayName: Manifest
      description: Manifest service
      image: casehubio/manifest:latest

  eidos:
    type: claudony_app
    dependsOn: [manifest]
    spec:
      name: eidos
      displayName: Eidos
      description: Identity service
      image: casehubio/eidos:latest

  engine:
    type: claudony_app
    dependsOn: [eidos]
    spec:
      name: engine
      displayName: Engine
      description: Engine service
      image: casehubio/engine:latest

  my-llm:
    type: claudony_app
    dependsOn: [engine]
    forEach:
      as: llm
      in: llm-fleet
    spec:
      name: my-llm-${each.llm.name}
      displayName: LLM ${each.llm.name}
      description: LLM agent ${each.llm.role}
      image: casehubio/my-llm-app:latest
      config:
        llm.agent-id: my-llm-${each.llm.name}
        llm.name: LLM ${each.llm.name}
        llm.role: ${each.llm.role}
        llm.capability: ${each.llm.capability}
        llm.archetype: ${each.llm.archetype}
        llm.adjective: ${each.llm.adjective}
        llm.domain: ${each.llm.domain}
        llm.identity-source: eidos
