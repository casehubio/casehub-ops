# Level 02: Accountability
# Methodology step: DEPLOY — Audit Trail
# Prerequisites: Level 01

desiredState:
  namespace: casehub
  name: accountability

nodes:
  platform:
    type: casehub_application
    spec:
      applicationId: platform
      image: casehubio/casehub-runtime:latest
      deploymentTarget: claudony
      replicas: 1
      config:
        role: platform

  ledger:
    type: casehub_application
    dependsOn: [platform]
    spec:
      applicationId: ledger
      image: casehubio/casehub-runtime:latest
      deploymentTarget: claudony
      replicas: 1
      config:
        role: ledger
