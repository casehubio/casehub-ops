# Level 10: Pool Deployment
# Methodology step: DEPLOY — Managed Instance Pool
# Prerequisites: Level 04, Level 06
# See README.md for walkthrough

desiredState:
  namespace: casehub
  name: support-pool

nodes:
  platform:
    type: casehub_application
    spec:
      applicationId: platform
      image: casehubio/casehub-runtime:latest
      deploymentTarget: claudony
      replicas: 1
      config:
        role: platform

  support-app:
    type: casehub_application
    dependsOn: [platform]
    spec:
      applicationId: support-app
      image: casehubio/casehub-runtime:latest
      deploymentTarget: claudony
      replicas: 1
      config:
        role: support
        support.mode: pool-managed
        support.channel: direct

  support-pool:
    type: pool
    dependsOn: [support-app]
    spec:
      applicationId: support-app
      agentId: support-agent
      backend: claudony
      minActive: 3
      maxActive: 8
