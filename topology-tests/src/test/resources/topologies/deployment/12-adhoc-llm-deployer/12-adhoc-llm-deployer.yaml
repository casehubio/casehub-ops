# Level 12: Ad-hoc LLM Deployer
# Methodology step: OPERATE — Autonomous Deployment
# Prerequisites: Level 08 (fleet observability), Level 10 (pool deployment)
# See README.md for walkthrough

desiredState:
  namespace: casehub
  name: adhoc-llm-deployer

data:
  specialist-catalog:
    inline: |
      name:STRING,role:STRING,domain:STRING,archetype:STRING,knowledge-base:STRING
      product-x-specialist,specialist,product-x,expert,kb-product-x
      product-y-specialist,specialist,product-y,expert,kb-product-y
      escalation-specialist,escalation,incident-response,coordinator,kb-escalation

nodes:
  platform:
    type: casehub_application
    spec:
      applicationId: platform
      image: casehubio/casehub-runtime:latest
      deploymentTarget: claudony
      replicas: 1
      config:
        role: platform

  deployer:
    type: casehub_application
    dependsOn: [platform]
    spec:
      applicationId: deployer
      image: casehubio/casehub-runtime:latest
      deploymentTarget: claudony
      replicas: 1
      config:
        llm.agent-id: deployer
        llm.name: Deployer
        llm.role: deployer
        llm.capability: deployment-decision
        llm.archetype: orchestrator
        llm.domain: fleet-management
        deployer.specialist-catalog: specialist-catalog
