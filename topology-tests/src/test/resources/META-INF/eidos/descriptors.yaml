# Agent descriptors for the deployment topology tutorial.
# Each level adds services to the topology — the LLM app's identity
# comes from here, assembled into a system prompt by eidos.
#
# Level 01 (hello-llm): uses the static my-llm descriptor below.
#
# Level 04 (fleet scaling): each fleet member deploys with config
# properties (llm.capability, llm.role) set by the topology YAML.
# The parameterised descriptor uses ${config.*} references —
# DescriptorPreprocessor resolves them via MicroProfile Config
# (Quarkus) or Spring Environment at app startup. No code needed.

descriptors:
  # ── Static: Level 01 (hello-llm) ─────────────────────────────
  - agentId: my-llm
    name: Hello LLM
    slot: assistant
    disposition:
      conflictMode: collaborating
    capabilities:
      - name: conversation
        model:
          tier: FAST
          capabilities: [text]
    briefing: >-
      You are a helpful assistant deployed as part of the CaseHub
      deployment topology. Keep responses concise and friendly.

  # ── Parameterised: Level 04 (fleet scaling) ──────────────────
  # Each fleet member sets these config properties in its topology:
  #   llm.capability  — deep | fast | balanced
  #   llm.role        — analyst | developer | assistant
  #   llm.archetype   — investigator | engineer | coordinator
  #   llm.domain      — analysis | software-engineering | general
  # The preprocessor resolves ${config.*} before deserialization.
  - agentId: ${config.llm.agent-id:my-llm-fleet}
    name: ${config.llm.name:Fleet LLM}
    slot: ${config.llm.role:assistant}
    archetype: ${config.llm.archetype:assistant}
    archetypeAdjectives:
      - ${config.llm.adjective:versatile}
    domainVocabulary: ${config.llm.domain:general}
    disposition:
      conflictMode: collaborating
    capabilities:
      - name: conversation
        model:
          tier: ${config.llm.model-tier:FAST}
          capabilities: [text]
    briefing: >-
      You are a ${config.llm.archetype:assistant} agent with
      ${config.llm.capability:fast} capability in the
      ${config.llm.domain:general} domain. Part of a CaseHub
      LLM fleet.
