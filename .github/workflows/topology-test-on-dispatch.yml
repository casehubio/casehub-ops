name: Topology Tests (on image push)

on:
  repository_dispatch:
    types: [image-pushed]
  workflow_dispatch:
    inputs:
      image-source:
        description: 'Image source tier'
        required: false
        default: 'registry'

jobs:
  topology-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run topology tests (K8S)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn --batch-mode test -pl topology-tests -Pintegration-live
          -Dcasehub.topology.target-environment=k8s
          -Dcasehub.topology.image-source=${{ github.event.inputs.image-source || 'registry' }}

      - name: Run topology tests (PODMAN)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn --batch-mode test -pl topology-tests -Pintegration-live
          -Dcasehub.topology.target-environment=podman
          -Dcasehub.topology.image-source=${{ github.event.inputs.image-source || 'registry' }}
