agents:
  - spec:
      agentId: test-agent
      name: Test Agent
      slot: worker
    dependsOn: []
channels:
  - spec:
      name: test/work
      semantic: APPEND
    dependsOn: []
caseTypes:
  - spec:
      namespace: io.test
      name: test-case
      version: "1.0"
    dependsOn: []
trust:
  - spec:
      capability: review
      threshold: 0.7
      minimumObservations: 5
      borderlineMargin: 0.1
      blendFactor: 0.5
      bootstrapEscalationRequired: false
    dependsOn: []
applications:
  - spec:
      applicationId: test-app
      image: "ghcr.io/test/app:1.0"
      runtime:
        engine: "0.2"
        modules:
          - a2a
          - react
      config:
        llm: anthropic
      replicas: 2
    dependsOn: []
endpoints:
  - spec:
      path: test/kafka-stream
      type: SERVICE
      protocol: KAFKA
      properties:
        topic: test.events
      capabilities: [RECEIVE]
    dependsOn: []
